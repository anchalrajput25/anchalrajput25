<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-label="InsightX: natural-language to SQL with hybrid table retrieval, an AST-based read-only safety gate and a trust score. 92.6% execution accuracy (25 of 27) on a 108-table warehouse benchmark. Live demo." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
