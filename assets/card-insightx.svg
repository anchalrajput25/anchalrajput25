<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="InsightX: plain English to safe SQL. 92.6% execution accuracy on 108 tables; 100% destructive queries blocked; 100% unanswerable questions declined. Live demo." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .q1 { animation: cyc1 8s infinite; }
    .q2 { animation: cyc2 8s infinite; opacity: 0; }
    @keyframes cyc1 { 0%,45% { opacity: 1; } 50%,95% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes cyc2 { 0%,45% { opacity: 0; } 50%,95% { opacity: 1; } 100% { opacity: 0; } }
    .flow { stroke-dasharray: 4 6; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -10; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#151026"/></linearGradient>
    <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <clipPath id="f"><rect width="880" height="230" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#f)">
    <rect width="880" height="230" fill="url(#bg)"/>
    <rect width="5" height="230" fill="url(#acc)"/>
    <circle cx="880" cy="230" r="170" fill="#a78bfa" opacity=".06"/>

    <text class="mono" x="34" y="40" font-size="12" fill="#c4b5fd" letter-spacing="2">02 · LIVE PRODUCT</text>
    <text class="sans" x="34" y="78" font-size="30" font-weight="700" fill="#f0f6fc">InsightX</text>
    <text class="sans" x="34" y="106" font-size="15" fill="#c9d1d9">An AI data analyst: ask in plain English, get <tspan fill="#c4b5fd" font-weight="600">safe SQL</tspan></text>
    <text class="sans" x="34" y="126" font-size="15" fill="#c9d1d9">and a trust score on every answer.</text>

    <!-- query demo, two alternating scenes -->
    <g class="mono" font-size="12.5">
      <rect x="34" y="144" width="470" height="50" rx="8" fill="#0d1117" stroke="#30363d"/>
      <g class="q1">
        <text x="48" y="164" fill="#8b949e">"revenue by region last quarter"</text>
        <text x="48" y="184" fill="#e6edf3">SELECT region, SUM(amount) …  <tspan fill="#3fb950">✓ trust 0.94</tspan></text>
      </g>
      <g class="q2">
        <text x="48" y="164" fill="#8b949e">"delete all old customers"</text>
        <text x="48" y="184" fill="#ff9492">DELETE FROM customers …  <tspan fill="#f85149" font-weight="700">✕ BLOCKED</tspan></text>
      </g>
    </g>

    <text class="mono" x="34" y="214" font-size="11.5" fill="#6e7681">LangGraph · FastAPI · Next.js 15 · LLMOps tracing · 390+ tests · free LLMs only</text>

    <!-- hero metric + shields -->
    <g class="fade" style="animation-delay:.2s">
      <text class="sans" x="700" y="92" font-size="52" font-weight="800" fill="url(#acc)" text-anchor="middle">92.6%</text>
      <text class="sans" x="700" y="114" font-size="12" fill="#8b949e" text-anchor="middle">execution accuracy · 108-table warehouse</text>
      <line class="flow" x1="572" y1="132" x2="828" y2="132" stroke="#a78bfa" stroke-opacity=".5"/>
      <rect x="566" y="146" width="128" height="44" rx="10" fill="#2a1215" stroke="#f85149" stroke-opacity=".6"/>
      <text class="sans" x="630" y="166" font-size="16" font-weight="700" fill="#ff9492" text-anchor="middle">100%</text>
      <text class="sans" x="630" y="182" font-size="10.5" fill="#c9d1d9" text-anchor="middle">destructive blocked</text>
      <rect x="706" y="146" width="128" height="44" rx="10" fill="#1e1638" stroke="#a78bfa" stroke-opacity=".6"/>
      <text class="sans" x="770" y="166" font-size="16" font-weight="700" fill="#c4b5fd" text-anchor="middle">100%</text>
      <text class="sans" x="770" y="182" font-size="10.5" fill="#c9d1d9" text-anchor="middle">unanswerable declined</text>
      <text class="sans" x="700" y="214" font-size="12" fill="#3fb950" text-anchor="middle">● live demo</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="879" height="229" rx="16" fill="none" stroke="#30363d"/>
</svg>
