<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="Rootvanta: AI on-call agent. 0% false-success rate against a 100% baseline; 88.9% right cause on 1,000 incidents; 0 leaks in 625 tenant checks." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#0f1a1c"/></linearGradient>
    <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <clipPath id="f"><rect width="880" height="230" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#f)">
    <rect width="880" height="230" fill="url(#bg)"/>
    <rect width="5" height="230" fill="url(#acc)"/>
    <circle cx="880" cy="0" r="170" fill="#5eead4" opacity=".05"/>

    <text class="mono" x="34" y="40" font-size="12" fill="#5eead4" letter-spacing="2">01 · FLAGSHIP · ACTIVELY BUILDING</text>
    <text class="sans" x="34" y="78" font-size="30" font-weight="700" fill="#f0f6fc">Rootvanta</text>
    <text class="sans" x="34" y="106" font-size="15" fill="#c9d1d9">An AI on-call engineer that finds the cause of an incident,</text>
    <text class="sans" x="34" y="126" font-size="15" fill="#c9d1d9">applies a fix, then <tspan fill="#5eead4" font-weight="600">checks real metrics and rolls back</tspan> if it didn't work.</text>

    <!-- mini stats -->
    <g class="sans fade" style="animation-delay:.3s" font-size="13">
      <text x="34" y="160" fill="#8b949e">right cause</text>
      <rect x="150" y="150" width="130" height="12" rx="6" fill="#1f2937"/>
      <rect class="grow" style="animation-delay:.4s" x="150" y="150" width="116" height="12" rx="6" fill="#5eead4"/>
      <text class="mono" x="290" y="161" fill="#e6edf3">88.9%</text>

      <text x="34" y="184" fill="#8b949e">confidently wrong</text>
      <rect x="150" y="174" width="130" height="12" rx="6" fill="#1f2937"/>
      <rect class="grow" style="animation-delay:.6s" x="150" y="174" width="4" height="12" rx="2" fill="#f85149"/>
      <text class="mono" x="290" y="185" fill="#e6edf3">1.8%</text>

      <text x="360" y="161" fill="#8b949e">tenant leaks</text>
      <text class="mono" x="450" y="161" fill="#3fb950">0 / 625</text>
      <text x="360" y="185" fill="#8b949e">RCAEval</text>
      <text class="mono" x="450" y="185" fill="#e6edf3">0.49 <tspan fill="#6e7681">vs BARO 0.50</tspan></text>
    </g>

    <text class="mono" x="34" y="214" font-size="11.5" fill="#6e7681">FastAPI · Next.js · PostgreSQL RLS · Kubernetes · Helm · Argo CD · SSO · 254 tests</text>

    <!-- hero metric -->
    <g class="fade" style="animation-delay:.2s">
      <circle class="spin" cx="745" cy="112" r="84" fill="none" stroke="#5eead4" stroke-opacity=".35" stroke-dasharray="2 9"/>
      <circle cx="745" cy="112" r="68" fill="#0d1117" stroke="#1f2937"/>
      <text class="sans" x="745" y="124" font-size="44" font-weight="800" fill="url(#acc)" text-anchor="middle">0%</text>
      <text class="sans" x="745" y="146" font-size="11.5" fill="#8b949e" text-anchor="middle">false successes</text>
      <text class="sans" x="745" y="216" font-size="12" fill="#6e7681" text-anchor="middle">baseline "fix applied = fixed": <tspan fill="#ff9492">100%</tspan></text>
    </g>
  </g>
  <rect x=".5" y=".5" width="879" height="229" rx="16" fill="none" stroke="#30363d"/>
</svg>
