<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-label="Rootvanta: AI on-call engineer that finds the cause of production incidents, applies a fix, verifies it against live metrics and rolls back automatically if it fails." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
.fade{opacity:0;animation:fade .5s ease forwards}
@keyframes fade{to{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.flow{stroke-dasharray:3 4;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-7}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#0f1a1c"/></linearGradient><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><clipPath id="f"><rect width="880" height="290" rx="16"/></clipPath></defs>
<g clip-path="url(#f)">
<rect width="880" height="290" fill="url(#bg)"/>
<rect width="5" height="290" fill="url(#acc)"/>
<text class="mono" x="34" y="38" font-size="12" fill="#5eead4" letter-spacing="2">01 · FLAGSHIP · ACTIVELY BUILDING</text>
<text class="sans" x="34" y="72" font-size="29" font-weight="700" fill="#f0f6fc">Rootvanta</text>
<text class="sans" x="34" y="100" font-size="14.5" fill="#c9d1d9">AI on-call engineer that investigates and safely fixes production incidents.</text>
<g class="sans fade" style="animation-delay:0.15s"><circle cx="42" cy="125.5" r="7" fill="#5eead4" fill-opacity=".15" stroke="#5eead4" stroke-opacity=".6"/><path d="M38.5 125.5 l2.5 2.5 l4.5 -5" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="130" font-size="13.5" fill="#e6edf3">Finds the root cause from metrics, logs and traces</text></g>
<g class="sans fade" style="animation-delay:0.27s"><circle cx="42" cy="148.5" r="7" fill="#5eead4" fill-opacity=".15" stroke="#5eead4" stroke-opacity=".6"/><path d="M38.5 148.5 l2.5 2.5 l4.5 -5" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="153" font-size="13.5" fill="#e6edf3">Applies the fix (rollback, scale-up) with human approval</text></g>
<g class="sans fade" style="animation-delay:0.39s"><circle cx="42" cy="171.5" r="7" fill="#5eead4" fill-opacity=".15" stroke="#5eead4" stroke-opacity=".6"/><path d="M38.5 171.5 l2.5 2.5 l4.5 -5" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="176" font-size="13.5" fill="#e6edf3">Verifies the fix against live metrics before calling it done</text></g>
<g class="sans fade" style="animation-delay:0.51s"><circle cx="42" cy="194.5" r="7" fill="#5eead4" fill-opacity=".15" stroke="#5eead4" stroke-opacity=".6"/><path d="M38.5 194.5 l2.5 2.5 l4.5 -5" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="199" font-size="13.5" fill="#e6edf3">Rolls back on its own if the fix did not work</text></g>
<g class="fade" style="animation-delay:.8s"><rect x="34" y="216" width="540" height="30" rx="8" fill="#5eead4" fill-opacity=".08" stroke="#5eead4" stroke-opacity=".35"/><text class="sans" x="48" y="236" font-size="13" fill="#f0f6fc"><tspan fill="#5eead4" font-weight="700">Result  </tspan>1,000 test incidents: it never said a fix worked when it didn’t</text></g>
<text class="mono" x="34" y="272" font-size="11.5" fill="#6e7681">FastAPI · LangGraph · PostgreSQL · Next.js · Docker · Kubernetes · Helm · Argo CD</text>
<text class="mono fade" x="618" y="38" font-size="11" fill="#8b949e" letter-spacing="1.5">HOW IT WORKS</text>
<g class="fade" style="animation-delay:0.30s"><rect x="618" y="52" width="228" height="30" rx="8" fill="#0d1117" stroke="#30363d"/><text class="mono" x="630" y="71.5" font-size="10.5" fill="#5eead4">01</text><text class="sans" x="656" y="71.5" font-size="12.5" fill="#e6edf3">Alert fires</text></g>
<line class="flow fade" style="animation-delay:0.30s" x1="732.0" y1="82" x2="732.0" y2="92" stroke="#5eead4" stroke-opacity=".7"/>
<g class="fade" style="animation-delay:0.65s"><rect x="618" y="92" width="228" height="30" rx="8" fill="#0d1117" stroke="#30363d"/><text class="mono" x="630" y="111.5" font-size="10.5" fill="#5eead4">02</text><text class="sans" x="656" y="111.5" font-size="12.5" fill="#e6edf3">Find the root cause</text></g>
<line class="flow fade" style="animation-delay:0.65s" x1="732.0" y1="122" x2="732.0" y2="132" stroke="#5eead4" stroke-opacity=".7"/>
<g class="fade" style="animation-delay:1.00s"><rect x="618" y="132" width="228" height="30" rx="8" fill="#0d1117" stroke="#30363d"/><text class="mono" x="630" y="151.5" font-size="10.5" fill="#5eead4">03</text><text class="sans" x="656" y="151.5" font-size="12.5" fill="#e6edf3">Apply the fix</text></g>
<line class="flow fade" style="animation-delay:1.00s" x1="732.0" y1="162" x2="732.0" y2="172" stroke="#5eead4" stroke-opacity=".7"/>
<g class="fade" style="animation-delay:1.35s"><rect x="618" y="172" width="228" height="30" rx="8" fill="#0d1117" stroke="#30363d"/><text class="mono" x="630" y="191.5" font-size="10.5" fill="#5eead4">04</text><text class="sans" x="656" y="191.5" font-size="12.5" fill="#e6edf3">Check live metrics</text></g>
<line class="flow fade" style="animation-delay:1.35s" x1="732.0" y1="202" x2="732.0" y2="212" stroke="#5eead4" stroke-opacity=".7"/>
<g class="fade" style="animation-delay:1.70s"><rect class="pulse" x="618.0" y="212" width="110.0" height="30" rx="8" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/><text class="sans" x="673.0" y="231.5" font-size="12" font-weight="600" fill="#3fb950" text-anchor="middle">Keep fix ✓</text></g>
<g class="fade" style="animation-delay:1.90s"><rect class="pulse" x="736.0" y="212" width="110.0" height="30" rx="8" fill="#f85149" fill-opacity=".14" stroke="#f85149"/><text class="sans" x="791.0" y="231.5" font-size="12" font-weight="600" fill="#f85149" text-anchor="middle">Roll back ↺</text></g>
</g>
<rect x=".5" y=".5" width="879" height="289" rx="16" fill="none" stroke="#30363d"/></svg>