<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Anchal Singh Parihar, AI Engineer, building AI that knows when it is wrong." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade { opacity: 0; animation: fade .5s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { transform-origin: center; transform-box: fill-box; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.6); } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1080px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5eead4" stop-opacity=".09"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1f2937" stroke-width=".6"/>
    </pattern>
    <clipPath id="frame"><rect width="880" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    @keyframes typeIn { from { width: 0; } to { width: 420px; } }
    .t1 { animation: typeIn 1s steps(30,end) .5s forwards; }
    .t2 { animation: typeIn 1.2s steps(40,end) 2.2s forwards; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="880" height="340" fill="url(#bg)"/>
    <rect width="880" height="340" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="200" height="340" fill="url(#beam)"/>

    <!-- name + tagline -->
    <text class="sans fade" x="40" y="66" font-size="38" font-weight="700" fill="url(#title)">Anchal Singh Parihar</text>
    <text class="sans fade" style="animation-delay:.2s" x="42" y="98" font-size="17" fill="#c9d1d9">AI Engineer · building AI that <tspan fill="#5eead4" font-weight="600">knows when it’s wrong</tspan>.</text>

    <!-- status pill -->
    <g class="fade" style="animation-delay:.3s">
      <rect x="668" y="40" width="172" height="30" rx="15" fill="#0f2a22" stroke="#238636"/>
      <circle class="pulse" cx="688" cy="55" r="5" fill="#3fb950"/>
      <circle cx="688" cy="55" r="4" fill="#3fb950"/>
      <text class="sans" x="702" y="60" font-size="13" fill="#7ee2a8">open to AI/ML roles</text>
    </g>

    <!-- terminal -->
    <g class="fade" style="animation-delay:.35s">
      <rect x="40" y="124" width="470" height="182" rx="12" fill="#0d1117" stroke="#30363d"/>
      <circle cx="60" cy="142" r="5" fill="#f85149"/>
      <circle cx="78" cy="142" r="5" fill="#d29922"/>
      <circle cx="96" cy="142" r="5" fill="#3fb950"/>
      <text class="mono" x="275" y="146" font-size="11" fill="#6e7681" text-anchor="middle">on-call · rootvanta</text>
    </g>

    <g class="mono" font-size="13.5">
      <clipPath id="c1"><rect class="t1" x="58" y="160" width="0" height="22"/></clipPath>
      <text clip-path="url(#c1)" x="60" y="176" fill="#c9d1d9"><tspan fill="#5eead4">$</tspan> rootvanta investigate checkout-latency</text>

      <text class="fade" style="animation-delay:1.7s" x="60" y="200" fill="#8b949e">cause<tspan x="130" fill="#e6edf3">bad deploy v2.14 · db pool exhausted</tspan></text>
      <text class="fade" style="animation-delay:2.2s" x="60" y="222" fill="#8b949e">fix<tspan x="130" fill="#e6edf3">rollback v2.14 → v2.13</tspan></text>
      <text class="fade" style="animation-delay:3.4s" x="60" y="244" fill="#8b949e">check<tspan x="130" fill="#e6edf3">p99 812ms → 140ms over 5 min</tspan></text>
      <g class="fade" style="animation-delay:4.4s">
        <rect x="58" y="258" width="200" height="26" rx="6" fill="#0f2a22" stroke="#238636"/>
        <text x="70" y="276" fill="#3fb950" font-weight="700">✓ VERIFIED, not guessed</text>
      </g>
      <rect class="blink" x="270" y="264" width="8" height="15" fill="#5eead4" opacity=".8"/>
    </g>

    <!-- incident chart -->
    <g class="fade" style="animation-delay:.4s">
      <text class="sans" x="540" y="140" font-size="12" fill="#8b949e" letter-spacing="1.5">P99 LATENCY</text>
      <line x1="540" y1="282" x2="840" y2="282" stroke="#30363d"/>
      <line x1="540" y1="232" x2="840" y2="232" stroke="#21262d" stroke-dasharray="3 5"/>
      <text class="mono" x="842" y="228" font-size="10" fill="#6e7681" text-anchor="end">SLO</text>
    </g>
    <path class="draw" pathLength="1" style="animation-delay:.9s" d="M540 262 L570 258 L590 264 L612 256 L630 200 L645 168 L660 176 L676 160" fill="none" stroke="#f85149" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="fade" style="animation-delay:2.2s">
      <line x1="676" y1="150" x2="676" y2="282" stroke="#a78bfa" stroke-dasharray="4 4"/>
      <rect x="652" y="292" width="48" height="20" rx="10" fill="#1e1638" stroke="#a78bfa"/>
      <text class="sans" x="676" y="306" font-size="11" fill="#c4b5fd" text-anchor="middle">fix</text>
    </g>
    <path class="draw" pathLength="1" style="animation-delay:2.4s" d="M676 160 L690 196 L704 236 L720 254 L744 260 L770 257 L800 261 L838 258" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="fade" style="animation-delay:4.2s">
      <circle cx="838" cy="258" r="6" fill="#3fb950"/>
      <circle class="pulse" cx="838" cy="258" r="6" fill="#3fb950"/>
      <text class="sans" x="828" y="300" font-size="12" fill="#7ee2a8" text-anchor="end">recovered · kept</text>
    </g>
    <g class="fade" style="animation-delay:1.6s">
      <text class="sans" x="620" y="196" font-size="12" fill="#ff9492" text-anchor="end">incident</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="879" height="339" rx="18" fill="none" stroke="#30363d"/>
</svg>
