<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="Research: do LLMs know when a tool call helped? Probe AUROC rises from 0.60 before search to 0.75 after, +0.15 with 95% CI 0.06 to 0.24." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .rise { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: rise 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes rise { to { transform: scaleY(1); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#1c160b"/></linearGradient>
    <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <clipPath id="f"><rect width="880" height="230" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#f)">
    <rect width="880" height="230" fill="url(#bg)"/>
    <rect width="5" height="230" fill="url(#acc)"/>

    <text class="mono" x="34" y="40" font-size="12" fill="#fbbf24" letter-spacing="2">03 · RESEARCH</text>
    <text class="serif" x="34" y="78" font-size="27" font-style="italic" fill="#f0f6fc">Do LLMs know when a tool call helped?</text>
    <text class="sans" x="34" y="106" font-size="15" fill="#c9d1d9">Follow-up to Wu et al. 2026, <tspan font-style="italic">To Call or Not to Call</tspan> (arXiv:2605.00737),</text>
    <text class="sans" x="34" y="126" font-size="15" fill="#c9d1d9">on Llama-3.2-3B with BFCL web search.</text>

    <g class="sans fade" style="animation-delay:.3s" font-size="13">
      <text x="34" y="160" fill="#8b949e">finding</text>
      <text x="110" y="160" fill="#e6edf3">the model's "was this useful?" signal sharpens <tspan fill="#fbbf24">after</tspan> it sees the result</text>
      <text x="34" y="184" fill="#8b949e">bonus</text>
      <text x="110" y="184" fill="#e6edf3"><tspan fill="#fb923c" font-weight="700">19%</tspan> of runs used a wrong tool-argument name, missed by the original setup</text>
    </g>
    <text class="mono" x="34" y="214" font-size="11.5" fill="#6e7681">nested CV · paired bootstrap · judge κ 0.97 · runs on a free Colab T4</text>

    <!-- AUROC chart -->
    <g class="fade" style="animation-delay:.1s">
      <text class="sans" x="640" y="40" font-size="11" fill="#8b949e" letter-spacing="1.5">PROBE AUROC</text>
      <line x1="640" y1="190" x2="850" y2="190" stroke="#30363d"/>
      <line x1="640" y1="150" x2="850" y2="150" stroke="#21262d" stroke-dasharray="3 5"/>
      <text class="mono" x="634" y="153" font-size="9.5" fill="#6e7681" text-anchor="end">.5</text>
      <line x1="640" y1="70" x2="850" y2="70" stroke="#21262d" stroke-dasharray="3 5"/>
      <text class="mono" x="634" y="73" font-size="9.5" fill="#6e7681" text-anchor="end">.7</text>
    </g>
    <!-- scale: y = 190 - (v-0.4)*400 ; 0.60 -> 110, 0.75 -> 50 -->
    <rect class="rise" style="animation-delay:.4s" x="672" y="110" width="52" height="80" rx="5" fill="#374151"/>
    <rect class="rise" style="animation-delay:.8s" x="764" y="50" width="52" height="140" rx="5" fill="url(#bar)"/>
    <g class="fade" style="animation-delay:1.6s">
      <text class="mono" x="698" y="102" font-size="13" fill="#c9d1d9" text-anchor="middle">0.60</text>
      <text class="mono" x="790" y="42" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">0.75</text>
      <text class="sans" x="698" y="208" font-size="11" fill="#8b949e" text-anchor="middle">before search</text>
      <text class="sans" x="790" y="208" font-size="11" fill="#8b949e" text-anchor="middle">after search</text>
      <path d="M728 112 Q745 70 760 56" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text class="mono" x="745" y="225" font-size="11" fill="#fbbf24" text-anchor="middle">+0.15  95% CI [0.06, 0.24]</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="879" height="229" rx="16" fill="none" stroke="#30363d"/>
</svg>
