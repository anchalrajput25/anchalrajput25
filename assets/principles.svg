<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="How I work: evaluate first, fail safe, be honest about limits." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <g class="fade">
    <rect x=".5" y=".5" width="283" height="149" rx="14" fill="#0b0f17" stroke="#30363d"/>
    <text class="mono" x="24" y="38" font-size="22" fill="#5eead4">∑</text>
    <text class="sans" x="52" y="38" font-size="17" font-weight="700" fill="#f0f6fc">Evaluate first</text>
    <text class="sans" x="24" y="72" font-size="13" fill="#c9d1d9">I write the benchmark before</text>
    <text class="sans" x="24" y="92" font-size="13" fill="#c9d1d9">the feature, and publish the</text>
    <text class="sans" x="24" y="112" font-size="13" fill="#c9d1d9"><tspan fill="#5eead4">failure rate</tspan>, not just accuracy.</text>
  </g>
  <g class="fade" style="animation-delay:.2s">
    <rect x="298.5" y=".5" width="283" height="149" rx="14" fill="#0b0f17" stroke="#30363d"/>
    <text class="mono" x="322" y="38" font-size="22" fill="#c4b5fd">⛨</text>
    <text class="sans" x="352" y="38" font-size="17" font-weight="700" fill="#f0f6fc">Fail safe</text>
    <text class="sans" x="322" y="72" font-size="13" fill="#c9d1d9">Block the dangerous query.</text>
    <text class="sans" x="322" y="92" font-size="13" fill="#c9d1d9">Decline what can't be answered.</text>
    <text class="sans" x="322" y="112" font-size="13" fill="#c9d1d9"><tspan fill="#c4b5fd">Undo</tspan> the fix that didn't work.</text>
  </g>
  <g class="fade" style="animation-delay:.4s">
    <rect x="596.5" y=".5" width="283" height="149" rx="14" fill="#0b0f17" stroke="#30363d"/>
    <text class="mono" x="620" y="38" font-size="22" fill="#fbbf24">≈</text>
    <text class="sans" x="648" y="38" font-size="17" font-weight="700" fill="#f0f6fc">Honest about limits</text>
    <text class="sans" x="620" y="72" font-size="13" fill="#c9d1d9">Every project ships with a</text>
    <text class="sans" x="620" y="92" font-size="13" fill="#c9d1d9"><tspan fill="#fbbf24">Limitations</tspan> section and</text>
    <text class="sans" x="620" y="112" font-size="13" fill="#c9d1d9">confidence intervals.</text>
  </g>
</svg>
